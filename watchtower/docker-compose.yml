services:
  watchtower:
    # containrrr/watchtower was archived in 2025-12; this fork is maintained and negotiates the Docker API version
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    env_file: .env
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - WATCHTOWER_LABEL_ENABLE=true
      # Update reports go to Torgal (URL with its hook token in .env, gitignored);
      # the report template stays silent when nothing was updated or failed
      - WATCHTOWER_NOTIFICATION_REPORT=true
      - TZ=Europe/Paris
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # proxy-network: reaches torgal:8080 without leaving the host
    networks:
      - proxy-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-network:
    external: true
