services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    mem_reservation: 128m
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    environment:
      TZ: Europe/Paris
      DOMAIN: https://vault.francony.fr
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
    volumes:
      - ./data:/data
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  default:
    name: vaultwarden_network
    driver: bridge
