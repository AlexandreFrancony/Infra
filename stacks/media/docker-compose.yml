services:
  rdtclient:
    image: rogerfar/rdtclient:latest
    container_name: rdtclient
    mem_limit: 512m
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
    volumes:
      - ./rdtclient/config:/data/db
      - /home/bloster/downloads:/data/downloads
      - /mnt/hdd/jellyfin-media:/data/jellyfin-media
      - /home/bloster/scripts:/home/bloster/scripts
    ports:
      - "6500:6500"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    mem_limit: 1g
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
      - LOG_LEVEL=info
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    mem_limit: 512m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./prowlarr/config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    mem_limit: 512m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./sonarr/config:/config
      - /home/bloster/downloads:/data/downloads
      - /mnt/hdd/jellyfin-media:/data/jellyfin-media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    mem_limit: 512m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./radarr/config:/config
      - /home/bloster/downloads:/data/downloads
      - /mnt/hdd/jellyfin-media:/data/jellyfin-media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jellyseerr:
    image: fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    mem_limit: 512m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - TZ=Europe/Paris
      - PUID=1000
      - PGID=1000
    volumes:
      - ./jellyseerr/config:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  metube:
    image: alexta69/metube:latest
    container_name: metube
    mem_limit: 512m
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - UID=1000
      - GID=1000
      - DEFAULT_THEME=dark
      - YTDL_OPTIONS={"format":"bestvideo[vcodec^=avc1][height<=1080]+bestaudio[acodec^=mp4a]/best[height<=1080]","writethumbnail":true,"postprocessors":[{"key":"FFmpegThumbnailsConvertor","format":"jpg"}]}
      - DOWNLOAD_DIR=/downloads
    volumes:
      - /mnt/hdd/jellyfin-media/youtube:/downloads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    mem_limit: 512m
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - ./bazarr/config:/config
      # Same path as in Sonarr/Radarr: no path mapping to configure
      - /mnt/hdd/jellyfin-media:/data/jellyfin-media
    # No host port: reached through Pangolin (newt is on media_network)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: media_network
    driver: bridge
